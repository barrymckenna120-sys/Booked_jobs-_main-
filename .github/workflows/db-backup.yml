name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    concurrency:
      group: db-backup
      cancel-in-progress: false
    steps:
      - name: Normalise DB URL
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - << 'EOF'
          import os, urllib.parse as u
          p = u.urlsplit(os.environ["RAW"])
          ref = "ktkfuquqxbrmuqrmbmdj"
          userinfo, host = p.netloc.rsplit("@", 1)
          user, _, pw = userinfo.partition(":")
          if "." not in u.unquote(user):
              user = u.quote(u.unquote(user) + "." + ref, safe="")
          q = dict(u.parse_qsl(p.query)); q.setdefault("sslmode", "require")
          url = u.urlunsplit(("postgresql", f"{user}:{pw}@{host}", p.path or "/postgres", u.urlencode(q), ""))
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DB_URL={url}\n")
          EOF

      - name: Install postgresql-client 17 (matches Supabase server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::417953280285:role/bookedjobs-github-backup
          role-session-name: bookedjobs-db-backup-${{ github.run_id }}
          aws-region: eu-west-1

      - name: Run backup
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F-%H%M)
          FILE="backup-$STAMP.sql.gz"
          if ! /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$DB_URL" 2>/tmp/pg_dump.err | gzip > "/tmp/$FILE"; then
            sed -E -e 's#(postgres(ql)?://)[^[:space:]]*#(postgres URL REDACTED)#g' -e 's#(password=)[^&[:space:]]*#\1[REDACTED]#g' /tmp/pg_dump.err > /tmp/pg_dump.redacted
            MSG=$(head -10 /tmp/pg_dump.redacted | sed 's/%/%25/g' | paste -sd'|' - | sed 's/|/ | /g')
            echo "::error title=pg_dump failed::${MSG}"
            exit 1
          fi
          SIZE=$(stat -c%s "/tmp/$FILE")
          echo "Dump file size: $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::Backup file is only $SIZE bytes -- pg_dump likely failed. Aborting."
            exit 1
          fi
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Verify dump against live row counts
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -At -F$'\t' -c "select table_schema, table_name, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text::bigint from information_schema.tables where table_type='BASE TABLE' and (table_schema='public' or (table_schema='auth' and table_name='users'))" > /tmp/live_counts.tsv
          /usr/lib/postgresql/17/bin/pg_dump --version > /tmp/pg_dump_version.txt
          python3 - << 'PYEOF'
          import gzip, hashlib, json, math, os, sys, datetime

          stamp = os.environ["STAMP"]; fname = os.environ["FILE"]
          path = f"/tmp/{fname}"

          live = {}
          with open("/tmp/live_counts.tsv") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if not line:
                      continue
                  schema, table, count = line.split("\t")
                  live[f"{schema}.{table}"] = int(count)

          def norm(name):
              parts = name.split(".", 1)
              return ".".join(p.strip('"') for p in parts)

          dump = {}
          current = None
          with gzip.open(path, "rt", encoding="utf-8", errors="replace") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if current is None:
                      if line.startswith("COPY ") and line.endswith("FROM stdin;"):
                          name = line[5:].split(" (", 1)[0]
                          current = norm(name)
                          dump[current] = 0
                  else:
                      if line == "\\.":
                          current = None
                      else:
                          dump[current] += 1

          failures = []
          for key in sorted(live):
              d = dump.get(key); l = live[key]
              print(f"{key}\tdump={d if d is not None else 'MISSING'}\tlive={l}")
              if d is None:
                  if key.startswith("public.") or key == "auth.users":
                      failures.append(f"{key} missing from dump")
                  continue
              if d < math.floor(l * 0.98) - 5:
                  failures.append(f"{key} dump_count {d} < tolerance of live {l}")
          if dump.get("auth.users", 0) == 0:
              failures.append("auth.users missing or 0 rows")

          if failures:
              for msg in failures:
                  print(f"::error::{msg}")
              sys.exit(1)

          sha = hashlib.sha256()
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  sha.update(chunk)
          manifest = {
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "file": fname,
              "bytes": os.path.getsize(path),
              "sha256": sha.hexdigest(),
              "pg_dump_version": open("/tmp/pg_dump_version.txt").read().strip(),
              "tables": {k: {"dump_count": dump.get(k), "live_count": live[k]} for k in sorted(live)},
          }
          with open(f"/tmp/backup-{stamp}.manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("Verification passed")
          PYEOF

      - name: Upload to S3
        run: |
          set -euo pipefail
          aws s3 cp "/tmp/$FILE" "s3://bookedjobs-db-backups-eu-west-1/daily/$FILE"
          aws s3 cp "/tmp/backup-$STAMP.manifest.json" "s3://bookedjobs-db-backups-eu-west-1/daily/backup-$STAMP.manifest.json"
          echo "Backup complete: $FILE"

      - name: Record restore point
        run: |
          set -euo pipefail
          MF="/tmp/backup-$STAMP.manifest.json"
          BYTES=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['bytes'])" "$MF")
          SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['sha256'])" "$MF")
          TABLES=$(python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1]))['tables']))" "$MF")
          OUT=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -qAtX -v ON_ERROR_STOP=1 \
            -v stamp="$STAMP" -v file="$FILE" -v bytes="$BYTES" -v sha="$SHA" -v tables="$TABLES" <<'SQL' 2>&1
          BEGIN;
          WITH ins AS (
            INSERT INTO public.backup_runs (stamp, s3_key, bytes, sha256, table_counts)
            VALUES (:'stamp', 'daily/' || :'file', :'bytes'::bigint, :'sha', :'tables'::jsonb)
            ON CONFLICT (stamp) DO NOTHING
            RETURNING id
          )
          SELECT coalesce((SELECT id FROM ins), (SELECT id FROM public.backup_runs WHERE stamp = :'stamp')) AS run_id \gset
          INSERT INTO public.backup_run_tenants (backup_run_id, organisation_id, counts)
          SELECT :'run_id'::uuid, o.id, jsonb_build_object(
                   'customers',        (SELECT count(*) FROM public.customers        WHERE organisation_id = o.id),
                   'service_calls',    (SELECT count(*) FROM public.service_calls    WHERE organisation_id = o.id),
                   'quotes',           (SELECT count(*) FROM public.quotes           WHERE organisation_id = o.id),
                   'invoices',         (SELECT count(*) FROM public.invoices         WHERE organisation_id = o.id),
                   'job_payments',     (SELECT count(*) FROM public.job_payments     WHERE organisation_id = o.id),
                   'certificates',     (SELECT count(*) FROM public.certificates     WHERE organisation_id = o.id),
                   'job_media',        (SELECT count(*) FROM public.job_media        WHERE organisation_id = o.id),
                   'job_messages',     (SELECT count(*) FROM public.job_messages     WHERE organisation_id = o.id),
                   'engineers',        (SELECT count(*) FROM public.engineers        WHERE organisation_id = o.id),
                   'boiler_enquiries', (SELECT count(*) FROM public.boiler_enquiries WHERE organisation_id = o.id),
                   'parts_requests',   (SELECT count(*) FROM public.parts_requests   WHERE organisation_id = o.id)
                 )
          FROM public.organisations o
          ON CONFLICT (backup_run_id, organisation_id) DO UPDATE SET counts = EXCLUDED.counts;
          DELETE FROM public.backup_runs WHERE created_at < now() - interval '35 days';
          COMMIT;
          SELECT 'restore point recorded: ' || :'stamp';
          SQL
          ) || { echo "::error::restore point recording failed (details redacted)"; exit 1; }
          echo "$OUT"
