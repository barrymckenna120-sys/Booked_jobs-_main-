name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 2am UTC
  workflow_dispatch: {}  # lets you trigger manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17 (matches Supabase server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FILENAME="backup-$(date +%F-%H%M).sql.gz"

          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" | gzip > "/tmp/$FILENAME"

          # Sanity check: reject anything suspiciously small (a real dump should be at least a few KB)
          SIZE=$(stat -c%s "/tmp/$FILENAME")
          echo "Dump file size: $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::Backup file is only $SIZE bytes -- pg_dump likely failed or returned no data. Aborting upload."
            exit 1
          fi

          aws s3 cp "/tmp/$FILENAME" "s3://bookjobs-backup-bucket/daily/$FILENAME"
          echo "Backup complete: $FILENAME ($SIZE bytes)"
