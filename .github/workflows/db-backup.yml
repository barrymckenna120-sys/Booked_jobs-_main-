name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # daily at 2am UTC
  workflow_dispatch: {}  # lets you trigger manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILENAME="backup-$(date +%F-%H%M).sql.gz"
          pg_dump "$SUPABASE_DB_URL" | gzip > "/tmp/$FILENAME"
          aws s3 cp "/tmp/$FILENAME" "s3://bookjobs-backup-bucket/daily/$FILENAME"
