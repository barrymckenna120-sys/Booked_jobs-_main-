name: Verify Latest Backup

on:
  workflow_dispatch: {}  # run manually whenever you want to check backup contents

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Download latest backup from S3
        run: |
          LATEST=$(aws s3 ls s3://bookjobs-backup-bucket/daily/ | sort | tail -n 1 | awk '{print $4}')
          echo "Latest backup: $LATEST"
          aws s3 cp "s3://bookjobs-backup-bucket/daily/$LATEST" /tmp/latest.sql.gz
          gunzip -k /tmp/latest.sql.gz
          echo "Decompressed size: $(stat -c%s /tmp/latest.sql)"

      - name: Row counts per table (Python, reliable parsing)
        run: |
          python3 << 'PYEOF'
          import re

          with open('/tmp/latest.sql', 'r', errors='replace') as f:
              text = f.read()

          # Match each COPY block. Column list can contain its own parentheses
          # (e.g. numeric(10,2)), so we don't try to balance them -- we just
          # search non-greedily for the fixed literal "FROM stdin;" instead.
          # The newline before the closing "\." marker is only present when
          # the table has data -- an empty table's block has no blank line
          # before it, so that newline must be optional here.
          pattern = re.compile(
              r'^COPY public\.(\w+) \(.*?\) FROM stdin;\n(.*?)\n?\\\.$',
              re.MULTILINE | re.DOTALL
          )

          matches = list(pattern.finditer(text))
          total_copy_statements = len(re.findall(r'^COPY public\.\w+ \(', text, re.MULTILINE))
          print(f"=== Found {len(matches)} of {total_copy_statements} total COPY statements ===\n")
          if len(matches) != total_copy_statements:
              print("WARNING: parser did not match every COPY statement -- counts below may be incomplete\n")

          results = []
          for m in matches:
              table = m.group(1)
              data = m.group(2)
              row_count = 0 if data.strip() == '' else data.count('\n') + 1
              results.append((table, row_count))

          # Sort by row count descending so the tables with real data are obvious
          for table, count in sorted(results, key=lambda x: -x[1]):
              print(f"{table}: {count} rows")
          PYEOF

      - name: Search for K&N Gas Services tenant data
        run: |
          echo "=== Mentions of K&N / kngasservices in the dump ==="
          grep -ci "K&N" /tmp/latest.sql || echo "0 matches for K&N"
          grep -ci "kngasservices" /tmp/latest.sql || echo "0 matches for kngasservices"
          echo "=== Sample matching lines (first 5) ==="
          grep -i "kngasservices" /tmp/latest.sql | head -5 || true
